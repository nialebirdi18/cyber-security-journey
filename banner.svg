<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- circuit lines -->
  <g stroke="#1f2a3d" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0 40 H180 L210 70 H420"/>
    <path d="M0 240 H150 L180 210 H360 L390 240 H600"/>
    <path d="M1200 60 H980 L950 90 H760"/>
    <path d="M1200 220 H1000 L970 190 H820 L790 220 H700"/>
    <circle cx="210" cy="70" r="4" fill="#334155"/>
    <circle cx="420" cy="70" r="4" fill="#334155"/>
    <circle cx="950" cy="90" r="4" fill="#334155"/>
    <circle cx="600" cy="240" r="4" fill="#334155"/>
  </g>

  <!-- shield icon -->
  <g transform="translate(90,60)">
    <path d="M80 0 L160 28 V85 C160 135 126 168 80 184 C34 168 0 135 0 85 V28 Z"
          fill="none" stroke="url(#accent)" stroke-width="6"/>
    <path d="M80 20 L142 42 V85 C142 124 116 150 80 163 C44 150 18 124 18 85 V42 Z"
          fill="#0b1220" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <!-- lock -->
    <rect x="55" y="82" width="50" height="38" rx="6" fill="#22d3ee"/>
    <path d="M63 82 V66 a17 17 0 0 1 34 0 V82" fill="none" stroke="#22d3ee" stroke-width="7"/>
    <circle cx="80" cy="100" r="6" fill="#0b1220"/>
    <rect x="77" y="100" width="6" height="12" fill="#0b1220"/>
  </g>

  <!-- text -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="310" y="120" fill="#f8fafc" font-size="44" font-weight="700">Exams &amp; Certification Path</text>
    <text x="310" y="155" fill="#94a3b8" font-size="20">Network+ &#8594; Security+ &#8594; HTB &#8594; Cloud Security</text>
    <text x="310" y="190" fill="#22d3ee" font-size="16" letter-spacing="2">CYBERSECURITY JOURNEY</text>
  </g>
</svg>