<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5a4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="20" y="20" width="360" height="200" rx="14" fill="#0f172a" opacity="0.06"/>

  <!-- shield -->
  <g transform="translate(80,20)">
    <path d="M120 18c0 0-48 12-48 48 0 36 48 78 48 78s48-42 48-78c0-36-48-48-48-48z" fill="url(#g1)" filter="url(#shadow)"/>
  </g>

  <!-- padlock body -->
  <rect x="150" y="70" width="100" height="72" rx="10" fill="#0f172a" opacity="0.88"/>
  <rect x="162" y="82" width="76" height="48" rx="6" fill="#fff"/>

  <!-- shackle -->
  <path d="M200 44c-16 0-28 8-36 20v8h12v-8c0-6 8-12 24-12s24 6 24 12v8h12v-8c-8-12-20-20-36-20z" fill="#0f172a"/>

  <!-- keyhole -->
  <circle cx="200" cy="106" r="8" fill="#0f172a"/>
  <rect x="196" y="112" width="8" height="12" rx="2" fill="#0f172a"/>

  <!-- subtle accent lines -->
  <g opacity="0.06" fill="#000">
    <rect x="40" y="30" width="320" height="2" rx="1"/>
    <rect x="40" y="204" width="320" height="2" rx="1"/>
  </g>

  <!-- text badge -->
  <text x="200" y="196" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Niale's Cyber Security Journey</text>
</svg>
